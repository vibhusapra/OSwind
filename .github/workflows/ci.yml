name: macOS validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  native:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify compiled native model catalogs
        run: python3 scripts/generate-model-catalog.py --check
      - name: Verify pinned tokenizer source and license
        run: python3 scripts/check-tokenizer-vendor.py
      - name: Verify pinned native PII runtime headers and license
        run: python3 scripts/check-pii-runtime-vendor.py
      - name: Build and test
        run: swift test
      - name: Verify tokenizer patch against resolved upstream
        run: python3 scripts/check-tokenizer-vendor.py --upstream .build/checkouts/swift-transformers
      - name: Verify owned encrypted APFS images and app sessions
        run: OSWIND_TEST_NATIVE_VAULT=1 swift test --filter 'NativeVault|VaultSessionTests'
      - name: Verify pinned native-model installer without network
        run: python3 scripts/test-native-model-setup.py
      - name: Verify evaluation asset integrity contracts offline
        run: python3 scripts/test-prepare-speaker-eval.py
      - name: Verify authored PII scorer and frozen input contracts offline
        run: |
          python3 scripts/test-pii-quality.py
          python3 scripts/test-pii-assets.py
          python3 scripts/test-pii-native-export.py
      - name: Verify visual model tools without downloads
        run: |
          python3 scripts/test-visual-model-tools.py
          python3 scripts/visual-preparation-catalog.py --check
      - name: Verify bounded Python SDK protocols without network
        run: python3 scripts/test-python-sdk.py
      - name: Package app
        run: scripts/build-app.sh release
      - name: CLI smoke test
        run: |
          dist/OSwind.app/Contents/MacOS/oswindctl --data "$RUNNER_TEMP/oswind" note "OSwind CI searchable memory"
          dist/OSwind.app/Contents/MacOS/oswindctl --data "$RUNNER_TEMP/oswind" search --mode keyword searchable
      - name: Verify history-free PII CLI refusals without model downloads
        run: python3 scripts/pii-inspection-smoke.py dist/OSwind.app/Contents/MacOS/oswindctl --model-dir "$RUNNER_TEMP/absent-pii-model" --runtime-library "$RUNNER_TEMP/absent-pii-runtime.dylib" --root "$RUNNER_TEMP/pii-cli-offline"
      - name: Exercise encrypted-library CLI and interruptions
        run: |
          python3 scripts/vault-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-vault-process"
          python3 scripts/vault-interruption-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-vault-interruptions"
          python3 scripts/vault-terminal-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-vault-terminal"
          python3 scripts/vault-terminal-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-vault-terminal-busy" --held-reader
      - name: Exercise API and MCP processes
        run: python3 scripts/integration-smoke.py .build/release/oswindctl
      - name: Exercise explicit text collectors and Python SDK on encrypted APFS
        run: python3 scripts/collector-sdk-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-collector-sdk" --native-vault
      - name: Exercise offline Limitless API text migration on encrypted APFS
        run: python3 scripts/limitless-import-smoke.py dist/OSwind.app/Contents/MacOS/oswindctl --root "$RUNNER_TEMP/oswind-limitless-import" --native-vault
      - name: Exercise source-linked entity scopes, corrections and quiet backup
        run: python3 scripts/entity-memory-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-entity-memory"
      - name: Verify stable project corrections and quiet portability
        run: python3 scripts/project-corrections-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-project-corrections"
      - name: Verify project metadata preserves completed extraction
        run: python3 scripts/entity-metadata-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-entity-metadata"
      - name: Exercise indexed API and MCP processes
        run: python3 scripts/integration-smoke.py .build/release/oswindctl --indexed
      - name: Exercise durable conversation processes
        run: python3 scripts/conversation-smoke.py .build/release/oswindctl
      - name: Exercise long-source evidence and follow-ups
        run: python3 scripts/evidence-smoke.py .build/release/oswindctl
      - name: Exercise local chat provider and incomplete-response boundaries
        run: python3 scripts/chat-provider-smoke.py .build/release/oswindctl
      - name: Exercise required phrases and Boolean content across CLI, HTTP and MCP
        run: python3 scripts/search-expression-smoke.py .build/release/oswindctl
      - name: Exercise preview-guarded erasure and concurrent writer admission
        run: python3 scripts/erasure-smoke.py .build/release/oswindctl
      - name: Exercise single-delete and retention media safety
        run: python3 scripts/deletion-smoke.py .build/release/oswindctl --output .artifacts/deletion-ci.json
      - name: Exercise full-library wipe admission and durable retry
        run: python3 scripts/wipe-smoke.py .build/release/oswindctl --output .artifacts/wipe-ci.json
      - name: Exercise source-linked recap chains and portability
        run: python3 scripts/recap-smoke.py .build/release/oswindctl --output .artifacts/recap-ci.json
      - name: Exercise query scopes, literal mode and saved time bounds
        run: python3 scripts/query-scope-smoke.py .build/release/oswindctl --output .artifacts/query-scope-ci.json
      - name: Verify normalized domain import filtering across CLI HTTP and MCP
        run: |
          python3 scripts/domain-privacy-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-domain-privacy"
          cp "$RUNNER_TEMP/oswind-domain-privacy/report.json" .artifacts/domain-privacy-ci.json
      - name: Verify complete calendar counts across CLI HTTP and MCP
        run: |
          python3 scripts/activity-calendar-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-calendar"
          cp "$RUNNER_TEMP/oswind-calendar/report.json" .artifacts/activity-calendar-ci.json
      - name: Verify indexed tags and quiet portability
        run: |
          python3 scripts/tag-index-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-tags"
          cp "$RUNNER_TEMP/oswind-tags/report.json" .artifacts/tag-index-ci.json
      - name: Verify capture area compatibility and quiet portability
        run: |
          python3 scripts/capture-region-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-capture-regions"
          cp "$RUNNER_TEMP/oswind-capture-regions/report.json" .artifacts/capture-regions-ci.json
      - name: Exercise complete backup, restore and interruption recovery
        run: python3 scripts/backup-smoke.py .build/release/oswindctl --interruptions --output .artifacts/backup-process-ci.json
      - name: Exercise audio normalization, timestamp persistence and privacy
        run: python3 scripts/audio-smoke.py .build/release/oswindctl --output .artifacts/audio-process-ci.json
      - name: Verify persistent component-soak harness contracts
        run: python3 scripts/test-reliability-soak.py .build/release/oswindctl
      - name: Verify synthetic visual replay across processes
        run: python3 scripts/visual-replay-smoke.py .build/release/oswindctl
      - name: Exercise portable Markdown and media export
        run: python3 scripts/markdown-export-smoke.py .build/release/oswindctl --interruptions
      - name: Exercise scheduled routines and quiet backup restore
        run: python3 scripts/routines-smoke.py .build/release/oswindctl --output .artifacts/routines-ci.json
      - name: Verify long-transcript preview contracts
        run: python3 scripts/search-preview-smoke.py .build/release/oswindctl
      - name: Exercise recording-local speaker search across processes
        run: python3 scripts/speaker-search-smoke.py .build/release/oswindctl
      - name: Evaluate authored retrieval fixture
        run: |
          mkdir -p .artifacts
          .build/release/oswindctl eval-retrieval --fixture benchmarks/fixtures/desktop-retrieval-v1.json --output .artifacts/relevance-apple-ci.json
      - name: Verify vector scan self-match
        run: |
          .build/release/oswindctl benchmark-vectors --count 1000 --dimensions 128 --output .artifacts/vector-scaling-ci.json
          python3 - <<'PYCODE'
          import json
          report = json.load(open('.artifacts/vector-scaling-ci.json'))
          assert all(mode['top1_exact_match_rate'] == 1 for mode in report['modes'].values())
          PYCODE
      - name: Verify indexed identity and non-self recall
        run: |
          .build/release/oswindctl benchmark-vectors --count 1000 --dimensions 128 --indexed --quality-queries 8 --archive "$RUNNER_TEMP/oswind-vector-fixture" --output .artifacts/vector-indexed-ci.json
          python3 - <<'PYCODE'
          import json
          report = json.load(open('.artifacts/vector-indexed-ci.json'))
          assert all(mode['top1_exact_match_rate'] == 1 for mode in report['modes'].values())
          assert all(mode['recall_at_10'] >= .95 for mode in report['nonself_quality'].values())
          assert all(q['strategy'] == 'ann-exact-rerank' for mode in report['nonself_quality'].values() for q in mode['measurements'])
          PYCODE
      - name: Verify maintained archive statistics
        run: |
          .build/release/oswindctl benchmark-stats --archive "$RUNNER_TEMP/oswind-vector-fixture" --output .artifacts/statistics-ci.json
          python3 - <<'PYCODE'
          import json
          report = json.load(open('.artifacts/statistics-ci.json'))
          assert report['count'] == 1000 and report['schema_version'] == 22
          assert set(report['modes']) == {'maintained_sql', 'legacy_sql_scan', 'maintained_with_disk'}
          PYCODE
      - name: Verify long-source semantic passage processes
        run: python3 scripts/passage-smoke.py .build/release/oswindctl --provider apple --output .artifacts/passages-apple-ci.json
      - name: Render sample workspace
        run: |
          mkdir -p .artifacts
          python3 - <<'PYCODE'
          import pathlib, subprocess
          output = pathlib.Path('.artifacts/workspace-sample.png').resolve()
          subprocess.run(['.build/debug/OSwind', '--demo', '--render-preview', str(output)], check=True, timeout=30)
          assert output.stat().st_size > 10000
          PYCODE
      - name: Package portable archive
        run: ditto -c -k --sequesterRsrc --keepParent dist/OSwind.app dist/OSwind-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OSwind-macos-unsigned
          include-hidden-files: true
          path: |
            dist/OSwind-macos.zip
            .artifacts/workspace-sample.png
            .artifacts/relevance-apple-ci.json
            .artifacts/vector-scaling-ci.json
            .artifacts/vector-indexed-ci.json
            .artifacts/statistics-ci.json
            .artifacts/query-scope-ci.json
            .artifacts/domain-privacy-ci.json
            .artifacts/activity-calendar-ci.json
            .artifacts/tag-index-ci.json
            .artifacts/passages-apple-ci.json
            .artifacts/backup-process-ci.json
            .artifacts/audio-process-ci.json

  benchmark-harnesses:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Verify generated ASR assets without corpus downloads
        run: python3 scripts/test-prepare-asr-eval.py
      - name: Verify independent entity scorer and admission without corpus downloads
        run: |
          python3 scripts/entity_quality.py
          python3 scripts/test-entity-eval.py
      - name: Verify telemetry admission and owned-child boundaries without hardware
        run: python3 scripts/test-power-telemetry.py
      - name: Verify independent scorers and process boundaries on generated fixtures
        run: |
          python3 -m venv "$RUNNER_TEMP/oswind-scorers"
          "$RUNNER_TEMP/oswind-scorers/bin/python" -m pip install -r benchmarks/requirements-speaker-eval.txt -r benchmarks/requirements-speech-eval.txt
          "$RUNNER_TEMP/oswind-scorers/bin/python" scripts/test-speaker-eval.py
          "$RUNNER_TEMP/oswind-scorers/bin/python" scripts/test-asr-corpus-eval.py
