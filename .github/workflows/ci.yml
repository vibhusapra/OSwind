name: macOS validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  native:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify compiled native model catalogs
        run: python3 scripts/generate-model-catalog.py --check
      - name: Build and test
        run: swift test
      - name: Verify pinned native-model installer without network
        run: python3 scripts/test-native-model-setup.py
      - name: Package app
        run: scripts/build-app.sh release
      - name: CLI smoke test
        run: |
          dist/OSwind.app/Contents/MacOS/oswindctl --data "$RUNNER_TEMP/oswind" note "OSwind CI searchable memory"
          dist/OSwind.app/Contents/MacOS/oswindctl --data "$RUNNER_TEMP/oswind" search --mode keyword searchable
      - name: Exercise API and MCP processes
        run: python3 scripts/integration-smoke.py .build/release/oswindctl
      - name: Exercise indexed API and MCP processes
        run: python3 scripts/integration-smoke.py .build/release/oswindctl --indexed
      - name: Exercise durable conversation processes
        run: python3 scripts/conversation-smoke.py .build/release/oswindctl
      - name: Exercise long-source evidence and follow-ups
        run: python3 scripts/evidence-smoke.py .build/release/oswindctl
      - name: Exercise local chat provider and incomplete-response boundaries
        run: python3 scripts/chat-provider-smoke.py .build/release/oswindctl
      - name: Exercise query scopes, literal mode and saved time bounds
        run: python3 scripts/query-scope-smoke.py .build/release/oswindctl --output .artifacts/query-scope-ci.json
      - name: Exercise complete backup, restore and interruption recovery
        run: python3 scripts/backup-smoke.py .build/release/oswindctl --interruptions --output .artifacts/backup-process-ci.json
      - name: Exercise audio normalization, timestamp persistence and privacy
        run: python3 scripts/audio-smoke.py .build/release/oswindctl --output .artifacts/audio-process-ci.json
      - name: Exercise recording-local speaker search across processes
        run: python3 scripts/speaker-search-smoke.py .build/release/oswindctl
      - name: Evaluate authored retrieval fixture
        run: |
          mkdir -p .artifacts
          .build/release/oswindctl eval-retrieval --fixture benchmarks/fixtures/desktop-retrieval-v1.json --output .artifacts/relevance-apple-ci.json
      - name: Verify vector scan self-match
        run: |
          .build/release/oswindctl benchmark-vectors --count 1000 --dimensions 128 --output .artifacts/vector-scaling-ci.json
          python3 - <<'PYCODE'
          import json
          report = json.load(open('.artifacts/vector-scaling-ci.json'))
          assert all(mode['top1_exact_match_rate'] == 1 for mode in report['modes'].values())
          PYCODE
      - name: Verify indexed identity and non-self recall
        run: |
          .build/release/oswindctl benchmark-vectors --count 1000 --dimensions 128 --indexed --quality-queries 8 --archive "$RUNNER_TEMP/oswind-vector-fixture" --output .artifacts/vector-indexed-ci.json
          python3 - <<'PYCODE'
          import json
          report = json.load(open('.artifacts/vector-indexed-ci.json'))
          assert all(mode['top1_exact_match_rate'] == 1 for mode in report['modes'].values())
          assert all(mode['recall_at_10'] >= .95 for mode in report['nonself_quality'].values())
          assert all(q['strategy'] == 'ann-exact-rerank' for mode in report['nonself_quality'].values() for q in mode['measurements'])
          PYCODE
      - name: Verify maintained archive statistics
        run: |
          .build/release/oswindctl benchmark-stats --archive "$RUNNER_TEMP/oswind-vector-fixture" --output .artifacts/statistics-ci.json
          python3 - <<'PYCODE'
          import json
          report = json.load(open('.artifacts/statistics-ci.json'))
          assert report['count'] == 1000 and report['schema_version'] == 10
          assert set(report['modes']) == {'maintained_sql', 'legacy_sql_scan', 'maintained_with_disk'}
          PYCODE
      - name: Verify long-source semantic passage processes
        run: python3 scripts/passage-smoke.py .build/release/oswindctl --provider apple --output .artifacts/passages-apple-ci.json
      - name: Render sample workspace
        run: |
          mkdir -p .artifacts
          python3 - <<'PYCODE'
          import pathlib, subprocess
          output = pathlib.Path('.artifacts/workspace-sample.png').resolve()
          subprocess.run(['.build/debug/OSwind', '--demo', '--render-preview', str(output)], check=True, timeout=30)
          assert output.stat().st_size > 10000
          PYCODE
      - name: Package portable archive
        run: ditto -c -k --sequesterRsrc --keepParent dist/OSwind.app dist/OSwind-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OSwind-macos-unsigned
          include-hidden-files: true
          path: |
            dist/OSwind-macos.zip
            .artifacts/workspace-sample.png
            .artifacts/relevance-apple-ci.json
            .artifacts/vector-scaling-ci.json
            .artifacts/vector-indexed-ci.json
            .artifacts/statistics-ci.json
            .artifacts/query-scope-ci.json
            .artifacts/passages-apple-ci.json
            .artifacts/backup-process-ci.json
            .artifacts/audio-process-ci.json
