name: macOS validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  native:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify compiled native model catalogs
        run: python3 scripts/generate-model-catalog.py --check
      - name: Verify pinned tokenizer source and license
        run: python3 scripts/check-tokenizer-vendor.py
      - name: Verify pinned native PII runtime headers and license
        run: python3 scripts/check-pii-runtime-vendor.py
      - name: Verify pinned native PII preparation catalog
        run: python3 scripts/generate-pii-setup-catalog.py --check
      - name: Prepare authored native-index diagnostics
        run: python3 scripts/prepare-owned-index-probe.py "$RUNNER_TEMP/oswind-indexed-retrieval"
      - name: Build and test
        run: OSWIND_TEST_INDEXED_RETRIEVAL_OUTPUT="$RUNNER_TEMP/oswind-indexed-retrieval" OSWIND_TEST_NATIVE_MEDIA_RETAIN="$RUNNER_TEMP/oswind-media-migration" swift test
      - name: Independently inspect retained native media migration crashes
        run: python3 scripts/review-native-media-migration.py --root "$RUNNER_TEMP/oswind-media-migration" --output "$RUNNER_TEMP/oswind-media-migration-review.json"
      - name: Retain native media migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-native-media-migration
          path: |
            ${{ runner.temp }}/oswind-media-migration
            ${{ runner.temp }}/oswind-media-migration-review.json
          if-no-files-found: ignore
      - name: Verify owned named clipboard adapters without general clipboard access
        run: OSWIND_TEST_NATIVE_CLIPBOARD=1 swift test --filter NativeClipboardReaderTests
      - name: Retain authored native-index diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-indexed-retrieval
          path: ${{ runner.temp }}/oswind-indexed-retrieval
          if-no-files-found: ignore
      - name: Verify tokenizer patch against resolved upstream
        run: python3 scripts/check-tokenizer-vendor.py --upstream .build/checkouts/swift-transformers
      - name: Verify owned encrypted APFS images and app sessions
        run: OSWIND_TEST_NATIVE_VAULT=1 OSWIND_TEST_ATOMIC_INBOX_CRASH=1 OSWIND_TEST_VAULT_TRACE_DIR="$RUNNER_TEMP/oswind-vault-native-traces" OSWIND_TEST_VAULT_QUERY_TRACE_DIR="$RUNNER_TEMP/oswind-vault-query-traces" OSWIND_TEST_CREDENTIAL_DIAGNOSTIC_DIR="$RUNNER_TEMP/oswind-vault-credential-traces" swift test --filter 'AtomicPrivateInboxTests|NativeVault|VaultSessionTests'
      - name: Verify owner-addition app lifecycle with owned APFS and Keychain
        run: OSWIND_TEST_NATIVE_VAULT=1 OSWIND_TEST_NATIVE_SYNC_KEYCHAIN=1 OSWIND_OWNER_VAULT_TRACE_DIR="$RUNNER_TEMP/oswind-owner-vault-traces" OSWIND_OWNER_UI_QA_DIR="$RUNNER_TEMP/oswind-owner-approval-ui" swift test --filter OwnerAdditionAppSessionTests
      - name: Retain owned owner-addition component renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-owner-addition-ui
          path: ${{ runner.temp }}/oswind-owner-approval-ui/*.png
          if-no-files-found: ignore
      - name: Retain owned owner-addition vault diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-owner-addition-vault
          path: ${{ runner.temp }}/oswind-owner-vault-traces/*.json
          if-no-files-found: ignore
      - name: Verify peer membership update with owned APFS and Keychain
        run: OSWIND_TEST_NATIVE_VAULT=1 OSWIND_TEST_NATIVE_SYNC_KEYCHAIN=1 OSWIND_PEER_UI_QA_DIR="$RUNNER_TEMP/oswind-peer-membership-ui/peer" OSWIND_EXPANDED_SYNC_UI_QA_DIR="$RUNNER_TEMP/oswind-peer-membership-ui/folder" swift test --filter 'PersonalSyncMembershipUpdateTests|PeerMembershipAppSessionTests'
      - name: Retain owned peer membership component renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-peer-membership-ui
          path: |
            ${{ runner.temp }}/oswind-peer-membership-ui/peer/*.png
            ${{ runner.temp }}/oswind-peer-membership-ui/folder/*.png
          if-no-files-found: ignore
      - name: Verify recorded meeting workspace and retained-page vault detach
        run: OSWIND_TEST_NATIVE_VAULT=1 OSWIND_TEST_NATIVE_SYNC_KEYCHAIN=1 OSWIND_RECORDED_MEETING_UI_QA_DIR="$RUNNER_TEMP/oswind-recorded-meeting-ui" OSWIND_RECORDING_SCOPE_UI_DIR="$RUNNER_TEMP/oswind-recorded-meeting-ui" swift test --filter 'RecordedMeetingTests|RecordedMeetingRevisionTests|SyncNativeWriterAdmissionTests|RecordedMeetingIdentifierTests|RecordedMeetingPortabilityTests|RecordedMeetingsModelTests|NativeRecordedMeetingTests|SyncIncomingSourceTests.testIncomingRecordingProjectionKeepsOriginSessionSeparateAndDeletionRemovesMetadata|PersonalSyncMembershipUpdateTests.testOwnedNativeThreePublicSessionsPreserveThirteenKindsAndOriginalAccounts|RecordingScopeTests|SyncIncomingSourceTests.testRecordingSessionScopeSurvivesIncomingOriginRemappingAndReexport|SyncIncomingSourceTests.testSingleRecordingVersionScopeSurvivesExactIncomingProjection|SyncIncomingSourceTests.testRecordingScopedRunPreservesQuietRestoreAndRefusesLostSessionProvenance'
      - name: Retain owned recorded meeting components
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-recorded-meeting-ui
          path: ${{ runner.temp }}/oswind-recorded-meeting-ui/*.png
          if-no-files-found: ignore
      - name: Retain owned native vault diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vault-native-diagnostics
          path: |
            ${{ runner.temp }}/oswind-vault-native-traces/*.json
            ${{ runner.temp }}/oswind-vault-query-traces/*.json
            ${{ runner.temp }}/oswind-vault-credential-traces/*.json
          if-no-files-found: ignore
      - name: Verify pinned native-model installer without network
        run: python3 scripts/test-native-model-setup.py
      - name: Verify evaluation asset integrity contracts offline
        run: python3 scripts/test-prepare-speaker-eval.py
      - name: Verify authored PII scorer and frozen input contracts offline
        run: |
          python3 scripts/test-pii-quality.py
          python3 scripts/test-pii-native-quality.py
          python3 scripts/replay-pii-native-quality.py
          python3 scripts/test-pii-domain-quality.py
          python3 scripts/replay-pii-domain-admission.py
          python3 scripts/test-pii-coordinate-quality.py
          python3 scripts/replay-pii-domain-quality.py
          python3 scripts/replay-pii-reference-models.py
          python3 scripts/test-pii-assets.py
          python3 scripts/test-pii-native-export.py
      - name: Verify visual model tools without downloads
        run: |
          python3 scripts/test-visual-model-tools.py
          python3 scripts/visual-preparation-catalog.py --check
      - name: Verify bounded Python SDK protocols without network
        run: python3 scripts/test-python-sdk.py
      - name: Package app
        run: scripts/build-app.sh release
      - name: CLI smoke test
        run: |
          dist/OSwind.app/Contents/MacOS/oswindctl --data "$RUNNER_TEMP/oswind" note "OSwind CI searchable memory"
          dist/OSwind.app/Contents/MacOS/oswindctl --data "$RUNNER_TEMP/oswind" search --mode keyword searchable
      - name: Verify capture parser preserves exact target and bounded duration
        run: python3 scripts/test-capture-request-parser.py --output "$RUNNER_TEMP/oswind-capture-parser-v1.json"
      - name: Verify capture argument admission without history or native capture
        run: python3 scripts/capture-request-admission-smoke.py --binary dist/OSwind.app/Contents/MacOS/oswindctl --output "$RUNNER_TEMP/oswind-capture-arguments-v1.json"
      - name: Retain capture argument admission receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-capture-argument-admission
          path: |
            ${{ runner.temp }}/oswind-capture-arguments-v1.json
            ${{ runner.temp }}/oswind-capture-parser-v1.json
          if-no-files-found: ignore
      - name: Verify packaged media reservations and backup erasure fencing
        run: python3 scripts/media-cleanup-smoke.py dist/OSwind.app/Contents/MacOS/oswindctl --root "$RUNNER_TEMP/oswind-media-cleanup"
      - name: Retain packaged media cleanup process receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-media-cleanup-receipt
          path: |
            ${{ runner.temp }}/oswind-media-cleanup/report.json
            ${{ runner.temp }}/oswind-media-cleanup/backup.stderr
          if-no-files-found: ignore
      - name: Verify inactive owned SQLite fixture boundaries
        run: python3 scripts/test-owned-sqlite-fixture.py
      - name: Verify owned vault diagnostic admission without native tools
        run: python3 scripts/test-owned-vault-diagnostics.py
      - name: Verify authored phrase Boolean speaker and metadata query contracts
        run: python3 scripts/keyword-scope-smoke.py dist/OSwind.app/Contents/MacOS/oswindctl --baseline dist/OSwind.app/Contents/MacOS/oswindctl --root "$RUNNER_TEMP/oswind-keyword-scope"
      - name: Retain authored query contract receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-keyword-scope-receipt
          path: ${{ runner.temp }}/oswind-keyword-scope/report.json
          if-no-files-found: ignore
      - name: Verify owned canonical capture schema and process boundaries
        run: python3 scripts/sync-capture-smoke.py dist/OSwind.app/Contents/MacOS/oswindctl --root "$RUNNER_TEMP/oswind-sync-capture"
      - name: Retain canonical capture process receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-canonical-capture-receipt
          path: ${{ runner.temp }}/oswind-sync-capture/report.json
          if-no-files-found: ignore
      - name: Verify history-free PII CLI refusals without model downloads
        run: python3 scripts/pii-inspection-smoke.py dist/OSwind.app/Contents/MacOS/oswindctl --model-dir "$RUNNER_TEMP/absent-pii-model" --runtime-library "$RUNNER_TEMP/absent-pii-runtime.dylib" --root "$RUNNER_TEMP/pii-cli-offline"
      - name: Verify history-free PII setup CLI without downloads
        run: python3 scripts/pii-setup-smoke.py dist/OSwind.app/Contents/MacOS/oswindctl --root "$RUNNER_TEMP/pii-setup-offline"
      - name: Verify original-source pattern privacy across imports exports and media
        run: python3 scripts/privacy-mask-smoke.py dist/OSwind.app/Contents/MacOS/oswindctl --root "$RUNNER_TEMP/oswind-pattern-privacy"
      - name: Verify configured imports reject changed saved policies
        run: python3 scripts/import-preparation-smoke.py dist/OSwind.app/Contents/MacOS/oswindctl --root "$RUNNER_TEMP/oswind-import-preparation"
      - name: Verify bounded import files and pending collector wipe ordering
        run: python3 scripts/import-input-smoke.py dist/OSwind.app/Contents/MacOS/oswindctl --root "$RUNNER_TEMP/oswind-import-input"
      - name: Verify experimental import PII refuses missing assets and invalid settings offline
        run: python3 scripts/pii-import-smoke.py dist/OSwind.app/Contents/MacOS/oswindctl --root "$RUNNER_TEMP/oswind-pii-import"
      - name: Verify PII check records cannot be forged by JSON without model assets
        run: python3 scripts/pii-scan-record-smoke.py dist/OSwind.app/Contents/MacOS/oswindctl --root "$RUNNER_TEMP/oswind-pii-records"
      - name: Verify text-only mode boundaries and quiet portability without desktop capture
        run: |
          python3 scripts/accessibility-text-smoke.py dist/OSwind.app/Contents/MacOS/oswindctl --root "$RUNNER_TEMP/oswind-ax-text"
          mkdir -p .artifacts
          cp "$RUNNER_TEMP/oswind-ax-text/report.json" .artifacts/accessibility-text-ci.json
      - name: Verify sampled text scopes and quiet portability without native capture
        run: |
          python3 scripts/text-observation-smoke.py dist/OSwind.app/Contents/MacOS/oswindctl --root "$RUNNER_TEMP/oswind-text-observations"
          cp "$RUNNER_TEMP/oswind-text-observations/report.json" .artifacts/text-observation-ci.json
      - name: Exercise encrypted-library CLI and interruptions
        run: |
          python3 scripts/vault-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-vault-process"
          python3 scripts/vault-interruption-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-vault-interruptions"
          python3 scripts/vault-terminal-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-vault-terminal"
          python3 scripts/vault-terminal-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-vault-terminal-busy" --held-reader
          python3 scripts/vault-query-interruption-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-vault-query-interruptions"
      - name: Retain owned pattern and terminal process receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-pattern-terminal-receipts
          path: |
            ${{ runner.temp }}/oswind-pii-records/report.json
            ${{ runner.temp }}/oswind-pii-records/*.stdout
            ${{ runner.temp }}/oswind-pii-records/*.stderr
            ${{ runner.temp }}/oswind-pii-import/report.json
            ${{ runner.temp }}/oswind-pii-import/*.stdout
            ${{ runner.temp }}/oswind-pii-import/*.stderr
            ${{ runner.temp }}/oswind-pattern-privacy/report.json
            ${{ runner.temp }}/oswind-vault-terminal/report.json
            ${{ runner.temp }}/oswind-vault-terminal/*.pty-output
            ${{ runner.temp }}/oswind-vault-terminal/failure-*.json
            ${{ runner.temp }}/oswind-vault-terminal-busy/report.json
            ${{ runner.temp }}/oswind-vault-terminal-busy/*.pty-output
            ${{ runner.temp }}/oswind-vault-terminal-busy/failure-*.json
            ${{ runner.temp }}/oswind-vault-query-interruptions/report.json
            ${{ runner.temp }}/oswind-vault-query-interruptions/*.stdout
            ${{ runner.temp }}/oswind-vault-query-interruptions/*.stderr
          if-no-files-found: ignore
      - name: Exercise explicit external MCP client processes
        run: python3 scripts/mcp-client-smoke.py dist/OSwind.app/Contents/MacOS/oswindctl
      - name: Exercise API and MCP processes
        run: python3 scripts/integration-smoke.py .build/release/oswindctl
      - name: Exercise explicit text collectors and Python SDK on encrypted APFS
        run: python3 scripts/collector-sdk-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-collector-sdk" --native-vault
      - name: Exercise offline Limitless API text migration on encrypted APFS
        run: python3 scripts/limitless-import-smoke.py dist/OSwind.app/Contents/MacOS/oswindctl --root "$RUNNER_TEMP/oswind-limitless-import" --native-vault
      - name: Exercise source-linked entity scopes, corrections and quiet backup
        run: python3 scripts/entity-memory-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-entity-memory"
      - name: Verify stable project corrections and quiet portability
        run: python3 scripts/project-corrections-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-project-corrections"
      - name: Verify project metadata preserves completed extraction
        run: python3 scripts/entity-metadata-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-entity-metadata"
      - name: Exercise indexed API and MCP processes
        run: python3 scripts/integration-smoke.py .build/release/oswindctl --indexed
      - name: Exercise durable conversation processes
        run: python3 scripts/conversation-smoke.py .build/release/oswindctl
      - name: Exercise long-source evidence and follow-ups
        run: python3 scripts/evidence-smoke.py .build/release/oswindctl
      - name: Exercise local chat provider and incomplete-response boundaries
        run: python3 scripts/chat-provider-smoke.py .build/release/oswindctl
      - name: Exercise required phrases and Boolean content across CLI, HTTP and MCP
        run: python3 scripts/search-expression-smoke.py .build/release/oswindctl
      - name: Exercise preview-guarded erasure and concurrent writer admission
        run: python3 scripts/erasure-smoke.py .build/release/oswindctl
      - name: Exercise original-field erasure in actual schema-26 fixture copies
        run: python3 scripts/historical-erasure-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-historical-erasure-ci"
      - name: Exercise single-delete and retention media safety
        run: python3 scripts/deletion-smoke.py .build/release/oswindctl --output .artifacts/deletion-ci.json
      - name: Exercise full-library wipe admission and durable retry
        run: python3 scripts/wipe-smoke.py .build/release/oswindctl --output .artifacts/wipe-ci.json
      - name: Exercise source-linked recap chains and portability
        run: python3 scripts/recap-smoke.py .build/release/oswindctl --output .artifacts/recap-ci.json
      - name: Exercise query scopes, literal mode and saved time bounds
        run: python3 scripts/query-scope-smoke.py .build/release/oswindctl --output .artifacts/query-scope-ci.json
      - name: Verify normalized domain import filtering across CLI HTTP and MCP
        run: |
          python3 scripts/domain-privacy-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-domain-privacy"
          cp "$RUNNER_TEMP/oswind-domain-privacy/report.json" .artifacts/domain-privacy-ci.json
      - name: Verify complete calendar counts across CLI HTTP and MCP
        run: |
          python3 scripts/activity-calendar-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-calendar"
          cp "$RUNNER_TEMP/oswind-calendar/report.json" .artifacts/activity-calendar-ci.json
      - name: Verify indexed tags and quiet portability
        run: |
          python3 scripts/tag-index-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-tags"
          cp "$RUNNER_TEMP/oswind-tags/report.json" .artifacts/tag-index-ci.json
      - name: Verify capture area compatibility and quiet portability
        run: |
          python3 scripts/capture-region-smoke.py .build/release/oswindctl --root "$RUNNER_TEMP/oswind-capture-regions"
          cp "$RUNNER_TEMP/oswind-capture-regions/report.json" .artifacts/capture-regions-ci.json
      - name: Exercise complete backup, restore and interruption recovery
        run: python3 scripts/backup-smoke.py .build/release/oswindctl --interruptions --output .artifacts/backup-process-ci.json
      - name: Exercise audio normalization, timestamp persistence and privacy
        run: python3 scripts/audio-smoke.py .build/release/oswindctl --output .artifacts/audio-process-ci.json
      - name: Verify persistent component-soak harness contracts
        run: python3 scripts/test-reliability-soak.py .build/release/oswindctl
      - name: Verify synthetic visual replay across processes
        run: python3 scripts/visual-replay-smoke.py .build/release/oswindctl
      - name: Exercise portable Markdown and media export
        run: python3 scripts/markdown-export-smoke.py .build/release/oswindctl --interruptions
      - name: Exercise scheduled routines and quiet backup restore
        run: python3 scripts/routines-smoke.py .build/release/oswindctl --output .artifacts/routines-ci.json
      - name: Verify long-transcript preview contracts
        run: python3 scripts/search-preview-smoke.py .build/release/oswindctl
      - name: Exercise recording-local speaker search across processes
        run: python3 scripts/speaker-search-smoke.py .build/release/oswindctl
      - name: Evaluate authored retrieval fixture
        run: |
          mkdir -p .artifacts
          .build/release/oswindctl eval-retrieval --fixture benchmarks/fixtures/desktop-retrieval-v1.json --output .artifacts/relevance-apple-ci.json
      - name: Verify vector scan self-match
        run: |
          .build/release/oswindctl benchmark-vectors --count 1000 --dimensions 128 --output .artifacts/vector-scaling-ci.json
          python3 - <<'PYCODE'
          import json
          report = json.load(open('.artifacts/vector-scaling-ci.json'))
          assert all(mode['top1_exact_match_rate'] == 1 for mode in report['modes'].values())
          PYCODE
      - name: Verify indexed identity and non-self recall
        run: |
          .build/release/oswindctl benchmark-vectors --count 1000 --dimensions 128 --indexed --quality-queries 8 --archive "$RUNNER_TEMP/oswind-vector-fixture" --output .artifacts/vector-indexed-ci.json
          python3 - <<'PYCODE'
          import json
          report = json.load(open('.artifacts/vector-indexed-ci.json'))
          assert all(mode['top1_exact_match_rate'] == 1 for mode in report['modes'].values())
          assert all(mode['recall_at_10'] >= .95 for mode in report['nonself_quality'].values())
          assert all(q['strategy'] == 'ann-exact-rerank' for mode in report['nonself_quality'].values() for q in mode['measurements'])
          PYCODE
      - name: Verify maintained archive statistics
        run: |
          .build/release/oswindctl benchmark-stats --archive "$RUNNER_TEMP/oswind-vector-fixture" --output .artifacts/statistics-ci.json
          python3 - <<'PYCODE'
          import json
          report = json.load(open('.artifacts/statistics-ci.json'))
          assert report['count'] == 1000 and report['schema_version'] == 33
          assert set(report['modes']) == {'maintained_sql', 'legacy_sql_scan', 'maintained_with_disk'}
          PYCODE
      - name: Verify long-source semantic passage processes
        run: python3 scripts/passage-smoke.py .build/release/oswindctl --provider apple --output .artifacts/passages-apple-ci.json
      - name: Render sample workspace
        run: |
          mkdir -p .artifacts
          python3 - <<'PYCODE'
          import pathlib, subprocess
          output = pathlib.Path('.artifacts/workspace-sample.png').resolve()
          subprocess.run(['.build/debug/OSwind', '--demo', '--render-preview', str(output)], check=True, timeout=30)
          assert output.stat().st_size > 10000
          PYCODE
      - name: Package portable archive
        run: ditto -c -k --sequesterRsrc --keepParent dist/OSwind.app dist/OSwind-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OSwind-macos-unsigned
          include-hidden-files: true
          path: |
            dist/OSwind-macos.zip
            .artifacts/workspace-sample.png
            .artifacts/relevance-apple-ci.json
            .artifacts/vector-scaling-ci.json
            .artifacts/vector-indexed-ci.json
            .artifacts/statistics-ci.json
            .artifacts/query-scope-ci.json
            .artifacts/domain-privacy-ci.json
            .artifacts/activity-calendar-ci.json
            .artifacts/tag-index-ci.json
            .artifacts/passages-apple-ci.json
            .artifacts/backup-process-ci.json
            .artifacts/audio-process-ci.json
            .artifacts/accessibility-text-ci.json
            .artifacts/text-observation-ci.json

  benchmark-harnesses:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Verify generated ASR assets without corpus downloads
        run: python3 scripts/test-prepare-asr-eval.py
      - name: Verify local model setup presets and loopback routing offline
        run: python3 scripts/test-setup-models.py
      - name: Verify independent entity scorer and admission without corpus downloads
        run: |
          python3 scripts/entity_quality.py
          python3 scripts/test-entity-eval.py
      - name: Verify telemetry admission and owned-child boundaries without hardware
        run: python3 scripts/test-power-telemetry.py
      - name: Verify soak cleanup survives unavailable diagnostics without native capture
        run: python3 scripts/test-soak-process-owner.py
      - name: Verify paired keyword benchmark result and archive admission offline
        run: python3 scripts/test-keyword-scope-benchmark.py
      - name: Verify retained offline CLI keyword evidence rejects forged results
        run: python3 scripts/test-offline-keyword-review.py
      - name: Verify authored identity-scale review admission and typed frames offline
        run: python3 scripts/test-sync-identity-scale.py
      - name: Verify competitor comparison identities and stored-source admission without vendor downloads
        run: python3 scripts/test-compare-screenpipe.py
      - name: Verify independent scorers and process boundaries on generated fixtures
        run: |
          python3 -m venv "$RUNNER_TEMP/oswind-scorers"
          "$RUNNER_TEMP/oswind-scorers/bin/python" -m pip install -r benchmarks/requirements-speaker-eval.txt -r benchmarks/requirements-speech-eval.txt
          "$RUNNER_TEMP/oswind-scorers/bin/python" scripts/test-speaker-eval.py
          "$RUNNER_TEMP/oswind-scorers/bin/python" scripts/test-asr-corpus-eval.py
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify independent archived transcription payloads without vendor downloads
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: --no-deps --target "$RUNNER_TEMP/oswind-parquet-reader" -r benchmarks/requirements-screenpipe-oracle.txt
          PYTHONPATH="$RUNNER_TEMP/oswind-parquet-reader" python3 scripts/test-screenpipe-parquet.py

  recording-names:
    name: Recording names, calendar review and native lifecycle
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify recording names, calendar review, archive aliases and native shutdown
        env:
          OSWIND_TEST_NATIVE_VAULT: '1'
          OSWIND_TEST_NATIVE_SYNC_KEYCHAIN: '1'
          OSWIND_RECORDING_NAMES_UI_QA_DIR: ${{ runner.temp }}/oswind-recording-names/names
          OSWIND_RECORDED_MEETING_UI_QA_DIR: ${{ runner.temp }}/oswind-recording-names/archive
          OSWIND_RECORDING_SCOPE_UI_DIR: ${{ runner.temp }}/oswind-recording-names/scope
          OSWIND_RECORDING_CALENDAR_UI_QA_DIR: ${{ runner.temp }}/oswind-recording-names/calendar
          OSWIND_SESSION_NAME_BENCH_DIR: ${{ runner.temp }}/oswind-recording-names/lookup
          OSWIND_TEST_VAULT_TRACE_DIR: ${{ runner.temp }}/oswind-recording-names/native-traces
          OSWIND_RECORDING_ORIGINAL_QA_DIR: ${{ runner.temp }}/oswind-recording-names/originals/outgoing
          OSWIND_TEST_INCOMING_SOURCE_ROOT: ${{ runner.temp }}/oswind-recording-names/originals/incoming
        run: |
          mkdir -p "$RUNNER_TEMP/oswind-recording-names/originals"
          swift test --jobs 4 --filter 'RecordingDetailsTests|RecordedMeetingsModelTests|RecordingNamesModelTests|RecordingSessionNamePerformanceTests|RecordingNameRenderTests|RecordingCalendar|MeetingContextTests|MeetingsModelTests|MeetingRequestTests|VaultSessionTests.testNativeRecordingName|VaultSessionTests.testNativeRecordingCalendar|SyncOutgoingTests.testRecordingOriginalRecovery|SyncOutgoingTests.testRecordingNameRecovers|SyncOutgoingTests.testRecordingNativeTranscript|SyncOutgoingTests.testRecordingReassignment|SyncOutgoingTests.testRecordingAffiliationScopeChangeAndNativeDeleteInvalidateItsLifetime|SyncOutgoingTests.testRecordingMetadataExplicitDifferentNativeTargetCannotReuseOldAffiliation|SyncIncomingSourceTests.testRecordingOriginalRecovery'
      - name: Retain owned recording-name components, lookup observations and authored original recovery corpora
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-names-owned-evidence
          path: |
            ${{ runner.temp }}/oswind-recording-names/names/*.png
            ${{ runner.temp }}/oswind-recording-names/archive/*.png
            ${{ runner.temp }}/oswind-recording-names/scope/*.png
            ${{ runner.temp }}/oswind-recording-names/calendar/*.png
            ${{ runner.temp }}/oswind-recording-names/lookup/result.json
            ${{ runner.temp }}/oswind-recording-names/native-traces/*.json
            ${{ runner.temp }}/oswind-recording-names/originals/
          include-hidden-files: true
          if-no-files-found: ignore
